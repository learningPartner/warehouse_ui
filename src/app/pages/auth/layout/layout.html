<div class="app-shell">
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand-lockup" href="#" aria-label="Havenspace home">
      <span class="brand-mark" aria-hidden="true">
        <i class="fa fa-cubes"></i>
      </span>
      <span class="brand-name">haven<span>space</span></span>
    </a>

    <div class="sidebar-section-label">WORKSPACE</div>
    <nav class="main-navigation" aria-label="Workspace">
      <a class="nav-link active" href="#" aria-current="page">
        <i class="fa fa-th-large" aria-hidden="true"></i>
        <span>Overview</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa fa-building" aria-hidden="true"></i>
        <span>Storage spaces</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa fa-users" aria-hidden="true"></i>
        <span>Clients</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa fa-cubes" aria-hidden="true"></i>
        <span>Inventory</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa fa-file-text-o" aria-hidden="true"></i>
        <span>Rental agreements</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa fa-credit-card" aria-hidden="true"></i>
        <span>Payments</span>
      </a>
    </nav>

    <div class="sidebar-section-label management-label">MANAGEMENT</div>
    <nav class="main-navigation" aria-label="Management">
      <a class="nav-link" href="#">
        <i class="fa fa-id-card-o" aria-hidden="true"></i>
        <span>Team members</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa fa-bar-chart" aria-hidden="true"></i>
        <span>Reports</span>
      </a>
      <a class="nav-link" href="#">
        <i class="fa fa-cog" aria-hidden="true"></i>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="user-card">
        <span class="user-avatar" aria-hidden="true">AM</span>
        <span class="user-details">
          <strong>{{loggedUser?.emailId}}</strong>
          <small>Administrator</small>
        </span>
        <button class="logout-button" type="button" (click)="onLogOff()" aria-label="Log off">
          <i class="fa fa-sign-out" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </aside>

  <div class="main-panel">
    <header class="topbar">
      <div class="topbar-start">
        <button class="sidebar-toggle" type="button" aria-label="Toggle sidebar">
          <i class="fa fa-bars" aria-hidden="true"></i>
        </button>
        <span class="topbar-divider" aria-hidden="true"></span>
        <div class="breadcrumb">
          <span>Workspace</span>
          <i class="fa fa-angle-right" aria-hidden="true"></i>
          <strong>Overview</strong>
        </div>
      </div>

      <div class="topbar-end">
        <span class="today-label">Warehouse Admin</span>
        <button class="topbar-icon-button notification-button" type="button" aria-label="Notifications">
          <i class="fa fa-bell-o" aria-hidden="true"></i>
          <span class="notification-indicator" aria-hidden="true"></span>
        </button>
        <span class="topbar-user-avatar" aria-hidden="true">AM</span>
      </div>
    </header>

    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>

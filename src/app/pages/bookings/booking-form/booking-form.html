<section class="booking-form-page">
  <header class="booking-heading">
    <div class="booking-eyebrow">
      <i class="fa fa-calendar-check-o" aria-hidden="true"></i>
      SPACE RENTALS
    </div>
    <div class="booking-heading-row">
      <a class="booking-back-link" href="#" aria-label="Back to bookings">
        <i class="fa fa-arrow-left" aria-hidden="true"></i>
      </a>
      <div>
        <h1>Create booking</h1>
        <p>Assign warehouse space to a client and set the booking details.</p>
      </div>
    </div>
  </header>

  <form class="form-layout">
    <section class="form-card" aria-labelledby="booking-details-heading">
      <div class="form-card-heading">
        <span class="form-section-icon" aria-hidden="true">
          <i class="fa fa-calendar-plus-o"></i>
        </span>
        <div>
          <h2 id="booking-details-heading">Booking details</h2>
          <p>Choose the client, rental period, and space required.</p>
        </div>
      </div>

      <div class="form-fields">
        <div class="field-group">
          <label for="booking-customer">Client <span class="required-mark">*</span></label>
          <div class="field-control field-select-control">
            <i class="fa fa-user-o" aria-hidden="true"></i>
            <select id="booking-customer" name="customerId" required>
              <option value="" selected disabled>Select a client</option>
            </select>
            <i class="fa fa-angle-down select-chevron" aria-hidden="true"></i>
          </div>
        </div>

        <div class="field-group">
          <label for="booking-area">Space required <span class="required-mark">*</span></label>
          <div class="field-control">
            <i class="fa fa-arrows-alt" aria-hidden="true"></i>
            <input
              id="booking-area"
              name="sqftAreaNeeded"
              type="number"
              min="1"
              step="1"
              placeholder="Enter area"
              required
            />
            <span class="input-suffix">sq ft</span>
          </div>
        </div>

        <div class="field-group">
          <label for="booking-from">Booking starts <span class="required-mark">*</span></label>
          <div class="field-control">
            <i class="fa fa-calendar-o" aria-hidden="true"></i>
            <input
              id="booking-from"
              name="bookingFromDate"
              type="datetime-local"
              required
            />
          </div>
        </div>

        <div class="field-group">
          <label for="booking-till">Booking ends <span class="required-mark">*</span></label>
          <div class="field-control">
            <i class="fa fa-calendar-o" aria-hidden="true"></i>
            <input
              id="booking-till"
              name="bookingTillDate"
              type="datetime-local"
              required
            />
          </div>
        </div>

        <div class="field-group">
          <label for="booking-amount">Total amount <span class="required-mark">*</span></label>
          <div class="field-control">
            <i class="fa fa-inr" aria-hidden="true"></i>
            <input
              id="booking-amount"
              name="totalAmount"
              type="number"
              min="0"
              step="0.01"
              placeholder="Enter total amount"
              required
            />
          </div>
        </div>

        <div class="field-group">
          <label for="booking-done-by">Booking handled by <span class="required-mark">*</span></label>
          <div class="field-control field-select-control">
            <i class="fa fa-id-badge" aria-hidden="true"></i>
            <select id="booking-done-by" name="bookingDoneBy" required>
              <option value="" selected disabled>Select an employee</option>
            </select>
            <i class="fa fa-angle-down select-chevron" aria-hidden="true"></i>
          </div>
        </div>
      </div>
    </section>

    <div class="form-actions">
      <a class="form-button form-button--secondary" href="#">Cancel</a>
      <button class="form-button form-button--primary" type="button">
        <i class="fa fa-check" aria-hidden="true"></i>
        Create booking
      </button>
    </div>
  </form>
</section>
